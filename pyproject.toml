[project]
name = "autonomous-trading-agent"
version = "0.1.0"
description = "Autonomous Agentic Trading System with MCP, Paper Trading, and Adaptive Learning"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",  # JWT

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # --- Cache / Message Bus ---
    "redis[hiredis]>=5.0.0",

    # --- MCP ---
    "mcp[cli]>=2.0.0",

    # --- Market Data ---
    "yfinance>=0.2.40",
    "alpha-vantage>=3.0.0",
    "finnhub-python>=2.4.20",

    # --- Broker ---
    "alpaca-py>=0.28.0",

    # --- Technical Analysis ---
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b1",
    "scipy>=1.14.0",

    # --- ML / Statistics ---
    "scikit-learn>=1.5.0",

    # --- LLM Providers ---
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",       # For Ollama REST API

    # --- Logging ---
    "structlog>=24.4.0",

    # --- Utilities ---
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",     # Retry logic
    "orjson>=3.10.0",      # Fast JSON
    "croniter>=3.0.0",     # Cron scheduling
    "aiofiles>=24.1.0",    # Async file I/O
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # TestClient
    "factory-boy>=3.3.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

ml = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
